<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E9EDF4" />
    <meta name="description" content="OriginOS 7 风格的习惯打卡应用：每日打卡、连续天数、体重记录" />
    <title>日常打卡 - Daily Checkin</title>

    <!-- 提前应用主题，避免深色模式下首帧闪白 -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('themePreference');
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>

    <!-- PWA：使用相对路径，dev 与 GitHub Pages 子路径下都能正确解析 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="日常打卡" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
