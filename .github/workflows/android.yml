name: Build Android APK

# 打 tag（v1.0.4 这种）会构建 APK 并作为 Release 附件上传，手机上直接下载安装；
# main 分支改动也会构建，方便随时拿到最新的调试包。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Capacitor CLI 8 要求 Node >= 22
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - run: npm ci
      - run: npm test

      # 用根路径打包：Capacitor 里资源从 https://localhost/ 提供，不能带 GitHub Pages 子路径
      - run: npm run build:app
      - run: npx cap sync android

      # 固定签名：CI 每次运行都会重新生成随机 debug keystore，导致各版本签名不一致，
      # 手机上无法覆盖安装。这里把固定密钥写到工作区并显式告诉 Gradle 用它
      # （不依赖 ~/.android 默认路径，runner 上那个位置会被重定向）。
      - name: Use fixed signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 ANDROID_DEBUG_KEYSTORE_BASE64，无法生成可覆盖安装的包"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/daily-checkin.keystore
          chmod 600 android/app/daily-checkin.keystore
          ls -l android/app/daily-checkin.keystore
          keytool -list -keystore android/app/daily-checkin.keystore -storepass android -alias androiddebugkey

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/daily-checkin.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 签名一旦漂移，手机就无法覆盖安装——直接把构建卡住，而不是等用户装机才发现
      - name: Verify APK signing cert
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name apksigner | sort -V | tail -1)
          echo "apksigner = $APKSIGNER"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*digest: *//' | tr -d ' \r' | tr 'a-f' 'A-F')
          echo "APK 签名 = $CERT"
          EXPECTED="2A:FA:F8:DB:E2:A4:A5:2E:8F:75:D8:E2:0E:D4:D0:9E:DD:BB:C5:7E:2A:84:7A:D6:9D:2A:1E:D4:94:2A:A6:B4"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::APK 签名与固定密钥不一致（$CERT），会导致安装冲突"
            exit 1
          fi
          echo "✅ 签名固定，新版本可直接覆盖安装"

      - name: Collect APK
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/daily-checkin-v${VERSION}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: daily-checkin-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            安卓安装包（debug 签名，可直接安装）。

            安装方式：手机浏览器打开本页 → 下载 `.apk` → 允许「安装未知来源应用」→ 安装。

            首次打开即包含完整离线数据，打卡记录保存在手机本地。

      # 同时把 APK 提交进仓库 apk/ 目录，方便直接 clone / pull 拿到安装包
      - name: Commit APK into repository
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p apk
          cp "out/daily-checkin-v${VERSION}.apk" apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          if git diff --cached --quiet; then
            echo "仓库中已存在 v${VERSION} 的 APK，跳过提交"
          else
            git commit -m "chore(release): 上传 v${VERSION} APK [skip ci]"
            git push origin main
          fi
